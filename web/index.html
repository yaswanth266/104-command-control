<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>104 Central Command Center</title>
<link rel="stylesheet" href="/static/style.css">

</head>
<body>

<div id="login" class="lwrap">
  <div class="lcard">
    <div style="text-align:center">
      <span class="mark"><i style="background:#FBBC41"></i><i style="background:#FB8B00"></i><i style="background:#CD004D"></i><i style="background:#4E148C"></i></span>
    </div>
    <h2>Central Command Center</h2>
    <div class="s">104 Diagnostic Project &middot; ticketing &amp; escalation</div>
    <div class="fld"><label>Username</label><input id="u" placeholder="calltaker" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="fld"><label>Password</label><input id="p" type="password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">Sign in</button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<div id="app" class="hide">
  <div class="top">
    <button class="nav-toggle" id="nav_toggle" onclick="toggleSidebar()" aria-label="Toggle Menu">&#9776;</button>
    <span class="mark" style="width:26px;height:26px"><i style="background:#FBBC41"></i><i style="background:#FB8B00"></i><i style="background:#CD004D"></i><i style="background:#4E148C"></i></span>
    <div class="wm">Central Command Center</div><div class="tag">104 DIAGNOSTIC</div>
    <div class="sp"></div>
    <button class="bell" id="bell" onclick="toggleNotifs()">&#128276;<span class="badge hide" id="nbadge">0</span></button>
    <div class="who" id="who"></div>
    <button class="lo" onclick="logout()">Logout</button>
  </div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-label">NAVIGATION MENU</span>
      </div>
      <div class="nav-tree" id="nav_tree"></div>
    </aside>
    <main class="main-content">
      <div id="body"></div>
    </main>
  </div>
</div>
<div id="modal"></div>
<div id="npanel"></div>

<script src="/static/app.js?v=6"></script>

</body>
</html>
