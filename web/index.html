<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>104 Central Command Center</title>
<link rel="icon" type="image/jpeg" href="/static/logo.jpg">
<link rel="stylesheet" href="/static/style.css?v=68">

</head>
<body>

<div id="login" class="lwrap">
  <div class="lcard">
    <div class="login-logo-container">
      <img src="/static/logo.jpg" alt="BAVYA Logo" class="login-logo-img">
    </div>

    <!-- Sign In Section -->
    <div id="login_section">
      <h2>Central Command Center</h2>
      <div class="s">104 Diagnostic Project &middot; ticketing &amp; escalation</div>
      <div class="fld"><label>Username</label><input id="u" placeholder="calltaker" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="fld">
        <label>Password</label>
        <div class="pw-wrap">
          <input id="p" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
          <button type="button" class="pw-toggle-btn" id="pw_toggle_btn" onclick="togglePasswordVisibility('p','pw_toggle_btn')" aria-label="Toggle password visibility" title="Show/Hide password">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:8px">
          <a href="javascript:void(0)" class="forgot-link" onclick="toggleForgotView(true)">Forgot password?</a>
        </div>
      </div>
      <button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">Sign in</button>
      <div class="err" id="lerr"></div>
    </div>

    <!-- Forgot Password Section -->
    <div id="forgot_section" class="hide">
      <h2>Reset Password</h2>
      <div class="s">Verify your account credentials to set a new password</div>
      <div class="fld"><label>Username *</label><input id="forgot_u" placeholder="Enter your username"></div>
      <div class="fld"><label>Registered Mobile Number *</label><input id="forgot_phone" placeholder="10-digit mobile number" maxlength="15"></div>
      <div class="fld">
        <label>New Password * (Min 8 chars)</label>
        <div class="pw-wrap" style="margin-top:6px">
          <input id="forgot_p" type="password" placeholder="Enter new password">
          <button type="button" class="pw-toggle-btn" id="fpw_toggle_btn" onclick="togglePasswordVisibility('forgot_p','fpw_toggle_btn')" aria-label="Toggle password visibility" title="Show/Hide password">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="fld">
        <label>Confirm New Password *</label>
        <div class="pw-wrap" style="margin-top:6px">
          <input id="forgot_cp" type="password" placeholder="Re-enter new password" onkeydown="if(event.key==='Enter')doForgotPassword()">
          <button type="button" class="pw-toggle-btn" id="fcpw_toggle_btn" onclick="togglePasswordVisibility('forgot_cp','fcpw_toggle_btn')" aria-label="Toggle password visibility" title="Show/Hide password">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>
      <button class="btn" style="width:100%;margin-top:10px" onclick="doForgotPassword()">Reset Password</button>
      <button class="btn o" style="width:100%;margin-top:8px" onclick="toggleForgotView(false)">Back to Sign In</button>
      <div class="err" id="forgot_msg"></div>
    </div>
  </div>
</div>

<div id="app" class="hide">
  <div class="top">
    <button class="nav-toggle" id="nav_toggle" onclick="toggleSidebar()" aria-label="Toggle Menu">&#9776;</button>
    <div class="brand-logo-container">
      <img src="/static/logo.jpg" alt="BAVYA Logo" class="brand-logo-img">
    </div>
    <div class="wm">Central Command Center</div><div class="tag">104 DIAGNOSTIC</div>
    <div class="sp"></div>
    <button class="auto-refresh-btn" id="auto_refresh_btn" onclick="toggleAutoRefresh()" title="Toggle live queue auto-refresh">
      <span class="pulse-dot"></span><span id="auto_refresh_label">Live</span>
    </button>
    <button class="sound-toggle-btn on" id="sound_toggle_btn" onclick="toggleSoundAlerts()" title="Toggle audio alert chimes">
      <svg class="sound-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
      <span id="sound_label">Audio ON</span>
    </button>
    <button class="bell" id="bell" onclick="toggleNotifs()" aria-label="Notifications" title="Notifications">
      <svg class="bell-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="badge hide" id="nbadge">0</span>
    </button>
    <div class="who" id="who" onclick="openProfile()" style="cursor:pointer" title="My Profile"></div>
    <button class="lo" onclick="logout()">Logout</button>
  </div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-label">NAVIGATION MENU</span>
      </div>
      <div class="nav-tree" id="nav_tree"></div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar_backdrop" onclick="closeSidebar()"></div>
    <main class="main-content">
      <div id="body"></div>
    </main>
  </div>
</div>
<div id="modal"></div>
<div id="npanel"></div>

<script src="/static/app.js?v=68"></script>

</body>
</html>
